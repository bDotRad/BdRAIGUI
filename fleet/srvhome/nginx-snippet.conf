# srvhome route - add this INSIDE the `server { listen 443 ssl; ... }`
# block of /etc/nginx/sites-available/bdrpiami (above the existing
# `location / { proxy_pass http://127.0.0.1:8000; }` that fronts
# Supabase). Then:
#
#   sudo nginx -t && sudo systemctl reload nginx
#
# Result: https://bdrpiami.local/status/  ->  srvhome on 127.0.0.1:8610
# Supabase stays on  https://bdrpiami.local/  (unchanged).

location = /status { return 301 /status/; }

location /status/ {
    proxy_pass http://127.0.0.1:8610/;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
}
