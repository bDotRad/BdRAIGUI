# nginx reverse proxy: https://bdrdev.local -> BdRGUI dashboard on 127.0.0.1:8420
#
# Install:
#   sudo cp /home/bdr/projects/_BdRGUI/nginx/bdrgui.conf /etc/nginx/sites-available/bdrgui
#   sudo ln -s /etc/nginx/sites-available/bdrgui /etc/nginx/sites-enabled/bdrgui
#   sudo rm -f /etc/nginx/sites-enabled/default
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cert is self-signed (see ../tls/) -- browsers will warn once per
# device until you tell them to trust it.

server {
    listen 80;
    listen [::]:80;
    server_name bdrdev.local BdRDev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bdrdev.local BdRDev;

    ssl_certificate     /home/bdr/projects/_BdRGUI/tls/bdrdev.local.crt;
    ssl_certificate_key /home/bdr/projects/_BdRGUI/tls/bdrdev.local.key;

    location / {
        proxy_pass http://127.0.0.1:8420;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
