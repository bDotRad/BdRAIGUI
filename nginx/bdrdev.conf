# nginx reverse proxy: https://bdrdev.local -> BdRDev dashboard on 127.0.0.1:8420
# Also answers on the machine hostname bdrsrvdev.local / BdRSrvDev (see
# 2026-08-25 rename: this Pi's hostname is now BdRSrvDev, was BdRDev) --
# NOTE: the TLS cert's SAN list does NOT yet include bdrsrvdev.local/BdRSrvDev,
# so browsers will show a name-mismatch warning until it's regenerated
# (see MIGRATION_REPORT.md).
#
# Install:
#   sudo cp /home/bdr/projects/BdRDev/nginx/bdrdev.conf /etc/nginx/sites-available/bdrdev
#   sudo ln -s /etc/nginx/sites-available/bdrdev /etc/nginx/sites-enabled/bdrdev
#   sudo rm -f /etc/nginx/sites-enabled/default /etc/nginx/sites-enabled/bdraigui /etc/nginx/sites-available/bdraigui
#   sudo rm -f /etc/nginx/sites-enabled/bdraigui
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cert is self-signed (see ../tls/) -- browsers will warn once per
# device until you tell them to trust it.

server {
    listen 80;
    listen [::]:80;
    server_name bdrdev.local BdRDev bdrsrvdev.local BdRSrvDev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bdrdev.local BdRDev bdrsrvdev.local BdRSrvDev;

    ssl_certificate     /home/bdr/projects/BdRDev/tls/bdrdev.local.crt;
    ssl_certificate_key /home/bdr/projects/BdRDev/tls/bdrdev.local.key;

    location / {
        proxy_pass http://127.0.0.1:8420;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
