# nginx reverse proxy: https://bdrdev.local -> BdRDev dashboard on 127.0.0.1:8420
# Also listed for the pending canonical name bdrsrvdev.local / BdRSrvDev
# (2026-08-25 rename plan -- the on-box hostname is still BdRDev, and
# bdrsrvdev.local does not resolve yet; see MIGRATION_REPORT.md).
# NOTE: the TLS cert (regenerated 2026-08-28 via tls/gen-cert.sh) now
# covers bdrdev.local, BdRDev, bdrsrvdev.local, BdRSrvDev, localhost and
# the LAN + Tailscale + loopback IPs. It is still self-signed, so
# browsers prompt once per device to trust it.
#
# Install:
#   sudo cp /home/bdr/projects/BdRDev/nginx/bdrdev.conf /etc/nginx/sites-available/bdrdev
#   sudo ln -s /etc/nginx/sites-available/bdrdev /etc/nginx/sites-enabled/bdrdev
#   sudo rm -f /etc/nginx/sites-enabled/default /etc/nginx/sites-enabled/bdraigui /etc/nginx/sites-available/bdraigui
#   sudo rm -f /etc/nginx/sites-enabled/bdraigui
#   sudo nginx -t && sudo systemctl reload nginx
#
# Cert is self-signed (see ../tls/) -- browsers will warn once per
# device until you tell them to trust it.

server {
    listen 80;
    listen [::]:80;
    server_name bdrdev.local BdRDev bdrsrvdev.local BdRSrvDev;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name bdrdev.local BdRDev bdrsrvdev.local BdRSrvDev;

    ssl_certificate     /home/bdr/projects/BdRDev/tls/bdrdev.local.crt;
    ssl_certificate_key /home/bdr/projects/BdRDev/tls/bdrdev.local.key;

    location / {
        proxy_pass http://127.0.0.1:8420;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}
